<template>
    <div class="lookup">
        <template if:true={hasValue}>
            <label class="slds-form-element__label"><template if:true={required}><abbr class="slds-required" title="required">*</abbr></template>{label}</label>
            <div class="pill">
                <lightning-icon icon-name="utility:record_lookup" size="x-small"></lightning-icon>
                <span class="pill-label">{selectedLabel}</span>
                <template if:false={disabled}><lightning-button-icon icon-name="utility:close" variant="bare" size="small" alternative-text="Clear" onclick={clear}></lightning-button-icon></template>
            </div>
        </template>
        <template if:false={hasValue}>
            <lightning-input type="search" label={label} required={required} disabled={disabled} placeholder={placeholder}
                             value={term} onchange={search} onfocus={search}></lightning-input>
            <template if:true={hasResults}>
                <ul class="results">
                    <template for:each={results} for:item="r">
                        <li key={r.value} data-value={r.value} data-label={r.label} onclick={pick}>{r.label}</li>
                    </template>
                </ul>
            </template>
        </template>
    </div>
</template>
